  <!-- Crown peaks (5 peaks, center tallest) -->
  <path d="M 14 14 L 17 5 L 20 14 Z" fill="url(#gold)"/>
  <path d="M 21 14 L 25 3 L 29 14 Z" fill="url(#gold)"/>
  <path d="M 27 14 L 32 1 L 37 14 Z" fill="url(#gold)"/>
  <path d="M 35 14 L 39 3 L 43 14 Z" fill="url(#gold)"/>
  <path d="M 44 14 L 47 5 L 50 14 Z" fill="url(#gold)"/>

  <!-- Cyan accent dot -->
  <circle cx="32" cy="54" r="1.5" fill="#06B6D4"/>
</svg>
